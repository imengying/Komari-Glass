name: Build tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set release version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const tag = process.env.RELEASE_TAG ?? "";
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$/.test(tag)) {
              throw new Error(`Tag ${tag} must use the v1.2.3 format`);
            }

            const version = tag.slice(1);
            for (const file of ["package.json", "komari-theme.json"]) {
              const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
              manifest.version = version;
              fs.writeFileSync(file, `${JSON.stringify(manifest, null, 2)}\n`);
            }
            console.log(`Release version: ${version}`);
          '

      - name: Build theme
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: komari-theme-glass-${{ github.ref_name }}
          path: release/komari-theme-glass-${{ github.ref_name }}-*.zip
          if-no-files-found: error

      - name: Create release notes from commit message
        run: git log -1 --format=%B "$GITHUB_SHA" > release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: release/komari-theme-glass-${{ github.ref_name }}-*.zip
